<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embed</title>

  <script src="../../study/studying.js"></script>
  <script src="../../classroom/class.api.js"></script>
  <script src="../../teach/teaching.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #browserFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <iframe
    id="browserFrame"
    title="Embedded site"
    allow="autoplay; clipboard-read; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>

  <div id="loading">Loading site...</div>

  <script src="./e.js"></script>
</body>
</html>
