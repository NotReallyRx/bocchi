<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | Bocchi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #201915;
      --surface: #2a2019;
      --surface-2: #33261c;
      --cream: #f2e6d6;
      --muted: #b4a08b;
      --amber: #e0a45f;
      --line: #3d3026;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: "Figtree", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #frame {
      width: 100%;
      height: 100%;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    #card {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      overflow: auto;

      border-radius: 26px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    /* The "0" is the site's loading ring; it spins, then turns into an X. */
    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.04em;

      font-family: "Fraunces", serif;
      font-weight: 500;
      font-size: clamp(96px, 26vw, 176px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--cream);
      margin: 0 0 24px;
    }

    .mark {
      position: relative;
      width: 0.66em;
      height: 0.66em;
      margin: 0 0.02em;
      border-radius: 50%;
      border: 0.09em solid var(--line);
      border-top-color: var(--amber);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0.62em;
      height: 0.09em;
      border-radius: 999px;
      background: var(--amber);
      opacity: 0;
    }

    /* After loading "fails", the ring is swapped for an X. */
    .mark.failed {
      border-color: transparent;
      animation: none;
    }

    .mark.failed::before,
    .mark.failed::after {
      opacity: 1;
      animation: pop 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .mark.failed::before { --r: 45deg; }
    .mark.failed::after  { --r: -45deg; }

    @keyframes pop {
      from { transform: translate(-50%, -50%) rotate(var(--r)) scaleX(0); }
      to   { transform: translate(-50%, -50%) rotate(var(--r)) scaleX(1); }
    }

    h1 {
      font-family: "Fraunces", serif;
      font-weight: 500;
      font-size: 22px;
      margin: 0 0 10px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
      max-width: 360px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .actions a,
    .actions button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .primary {
      background: var(--amber);
      color: var(--bg);
      border: 1px solid var(--amber);
    }

    .primary:hover { background: var(--cream); border-color: var(--cream); }

    .secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .secondary:hover { background: var(--surface-2); color: var(--cream); }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      #frame { padding: 8px; }
      #card { border-radius: 20px; }
    }
  </style>
</head>

<body>
  <div id="frame">
    <main id="card">

      <div class="code" role="img" aria-label="404">
        <span aria-hidden="true">4</span>
        <span class="mark" id="mark" aria-hidden="true"></span>
        <span aria-hidden="true">4</span>
      </div>

      <h1>Page not found</h1>

      <p>
        The address may be mistyped, or the page has moved.
        Head back to the homepage to keep browsing.
      </p>

      <div class="actions">
        <a class="primary" href="../">Back to homepage</a>
        <button class="secondary" type="button" id="backButton">Go back</button>
      </div>

    </main>
  </div>

  <script>
    setTimeout(function () {
      document.getElementById("mark").classList.add("failed");
    }, 1250);

    document.getElementById("backButton").addEventListener("click", function () {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = "../";
      }
    });
  </script>
</body>

</html>
